[project]
name = "coldchain-ml"
version = "0.1.0"
requires-python = ">=3.12"  # numpy 2.5 / pandas 3 (ml/requirements.txt) need 3.12+

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Q1: fail the suite if coverage drops below the measured value minus 2.
addopts = "--cov=. --cov-report=term-missing --cov-report=xml --cov-fail-under=57"
[tool.coverage.run]
omit = ["constants.py", "tests/*"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["constants.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"report.py" = ["E501"]  # markdown template: report lines follow the document, not the code width
"data/card.py" = ["E501"]
