; ColdChain fridge node. One firmware, two devices: only FRIDGE_ID (and config.h secrets) differ.
; Build:  pio run -e fridge-01      Native unit tests:  pio test -e native
; Wi-Fi, WiFiClientSecure, Preferences (NVS) and mbedtls ship with the Arduino-ESP32 core.

[platformio]
default_envs = fridge-01

[esp32_base]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
build_flags = -Wall

[env:fridge-01]
extends = esp32_base
build_flags = ${esp32_base.build_flags} -DFRIDGE_ID=\"fridge-01\"

[env:fridge-02]
extends = esp32_base
build_flags = ${esp32_base.build_flags} -DFRIDGE_ID=\"fridge-02\"

; Wiring check before the real firmware exists (P01). Builds test/hw_smoke.cpp instead of src/.
[env:hw-smoke]
extends = esp32_base
build_src_filter = -<*> +<../test/hw_smoke.cpp>

; Pure logic (classify, hysteresis, exposure, buffer) is unit-tested on the PC.
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall
