[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coldchain-tools"
version = "0.1.0"
description = "ColdChain virtual fridge node, simulation engine, attack and tamper tools"
requires-python = ">=3.11"
dependencies = ["paho-mqtt>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "platformio>=6.1"]

[tool.setuptools]
packages = ["coldchain_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
