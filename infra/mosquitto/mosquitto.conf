# Local dev broker only. Production/Wokwi traffic uses the cloud broker (TLS 8883), or the production compose
# file with its own TLS listener (infra/docker-compose.prod.yml).
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
# per-account topic rules (S4): each device only on its own topics, see the file
acl_file /mosquitto/config-src/acl

# Persistent sessions survive a broker restart (R2): the backend connects with a stable client id and
# clean_session false, so QoS 1 messages queued for it while it restarts are kept, up to the cap below.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60
max_queued_messages 10000

log_dest stdout
