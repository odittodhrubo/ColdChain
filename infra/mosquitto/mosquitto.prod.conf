# Production broker (docker-compose.prod.yml). Devices connect over TLS on 8883; the backend uses plain 1883 on the
# internal Docker network only (never published). Accounts: passwd.prod (git-ignored, see docs/backend.md
# "Production with Docker"), topic rules: acl (one account per device, S4).
per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config-src/acl

listener 1883

listener 8883
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

persistence true
persistence_location /mosquitto/data/
autosave_interval 60
max_queued_messages 10000

log_dest stdout
