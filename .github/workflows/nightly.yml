# Nightly (and on demand): the checks too slow for every PR.
# - every end-to-end scenario S1-S10 and failure injection (about 15 min);
# - the live security probes and the dependency audit (new advisories appear without any commit);
# - the API latency check;
# - the firmware in Wokwi, when the WOKWI_CLI_TOKEN repository secret is set (wokwi.com/dashboard/ci).
name: nightly
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  scenarios-security-perf:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            ml/requirements-dev.txt
            tools/pyproject.toml
      - name: Install
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          python -m venv .venv
          .venv/bin/python -m pip install -r ml/requirements-dev.txt -e "tools[dev]"
          node tools/init_env.js
      - name: Scenarios S1-S10 + failure injection
        run: cd tools && ../.venv/bin/python -m coldchain_tools.scenarios
      - name: Security (static + live probes)
        if: always()
        run: cd tools && ../.venv/bin/python -m coldchain_tools.security_check --no-doc
      - name: Performance (p95 < 200 ms)
        if: always()
        run: cd tools && ../.venv/bin/python -m coldchain_tools.perf

  wokwi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.WOKWI_CLI_TOKEN != ''
      - uses: actions/setup-python@v5
        if: env.WOKWI_CLI_TOKEN != ''
        with:
          python-version: '3.14'
      - name: 'Build hw-smoke and fridge-01 (placeholder config: no config.h in CI)'
        if: env.WOKWI_CLI_TOKEN != ''
        run: |
          python -m pip install platformio
          pio run -d firmware/fridge-node -e hw-smoke -e fridge-01
      - name: Install wokwi-cli
        if: env.WOKWI_CLI_TOKEN != ''
        run: curl -L https://wokwi.com/ci/install.sh | sh
      - name: hw-smoke boots and finds the OLED
        if: env.WOKWI_CLI_TOKEN != ''
        run: |
          ~/.wokwi/bin/wokwi-cli --timeout 20000 --expect-text "ColdChain hardware smoke test" firmware/fridge-node/wokwi/hw-smoke
          ~/.wokwi/bin/wokwi-cli --timeout 20000 --expect-text "0x3C" firmware/fridge-node/wokwi/hw-smoke
      - name: fridge-01 firmware boots
        if: env.WOKWI_CLI_TOKEN != ''
        run: ~/.wokwi/bin/wokwi-cli --timeout 20000 --expect-text "ColdChain node fridge-01 fw 1.0.0 booting" firmware/fridge-node/wokwi/fridge-01
      - name: No token
        if: env.WOKWI_CLI_TOKEN == ''
        run: echo "WOKWI_CLI_TOKEN secret not set; skipping the Wokwi run (KNOWN_ISSUES.md #5)."
