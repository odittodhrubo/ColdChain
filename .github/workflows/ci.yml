# Every push to main and every PR: lint, every test suite (incl. firmware native tests and generated-file
# freshness), the static security checks, the Playwright flows and the security / tamper / RBAC scenarios.
# The long scenarios (S1-S6, S10, failure injection), the live security probes and Wokwi run in nightly.yml.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the secrets scan reads the whole git history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            ml/requirements-dev.txt
            tools/pyproject.toml
      - name: Install
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          python -m venv .venv
          .venv/bin/python -m pip install -r ml/requirements-dev.txt -e "tools[dev]" platformio
      - name: Lint (eslint + tsc, ruff)
        run: |
          . .venv/bin/activate
          npm run lint
          ruff format --check ml tools
      - name: 'Test every suite (firmware native included: --strict fails without PlatformIO)'
        run: node tools/test_all.js --strict
      - name: 'Security (static: dependency audit, secrets in tree and history, ignore rules)'
        run: cd tools && ../.venv/bin/python -m coldchain_tools.security_check --static --no-doc
      - name: Coverage reports (Q1)
        if: always() # the suites enforce their own thresholds; this keeps the reports for inspection
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            backend/coverage/
            frontend/coverage/
            ml/coverage.xml
            tools/coverage.xml
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            ml/requirements-dev.txt
            tools/pyproject.toml
      - name: Install
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          python -m venv .venv
          .venv/bin/python -m pip install -r ml/requirements-dev.txt -e "tools[dev]"
          cd frontend && npx playwright install --with-deps chromium
      - name: Generate a throwaway .env (CI only, never committed)
        run: node tools/init_env.js
      - name: Playwright flows (real backend + ML service)
        run: npm --prefix frontend run e2e
      - name: Scenarios S7 (device security), S8 (tamper evidence), S9 (RBAC, live)
        run: cd tools && ../.venv/bin/python -m coldchain_tools.scenarios --only S7 S8 S9
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/test-results/
          retention-days: 7
